---

- name: Create pushgateway group
  ansible.builtin.group:
    name: "{{ pushgateway_group }}"
    system: true
    state: present

- name: Create pushgateway user
  ansible.builtin.user:
    name: "{{ pushgateway_user }}"
    group: "{{ pushgateway_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create pushgateway directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ pushgateway_install_dir }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ pushgateway_data_dir }}", owner: "{{ pushgateway_user }}", group: "{{ pushgateway_group }}", mode: "0700" }
    - { path: "{{ pushgateway_config_dir }}", owner: root, group: "{{ pushgateway_group }}", mode: "0750" }

- name: Check installed pushgateway version
  ansible.builtin.command: "{{ pushgateway_install_dir }}/pushgateway --version"
  register: pushgateway_installed_version
  changed_when: false
  failed_when: false

- name: Set version needs update fact
  ansible.builtin.set_fact:
    pushgateway_needs_install: >-
      {{ pushgateway_installed_version.rc != 0 or
         ('pushgateway, version ' + pushgateway_version) not in pushgateway_installed_version.stdout }}

- name: Download pushgateway tarball
  ansible.builtin.get_url:
    url: "{{ pushgateway_download_url }}"
    dest: "/tmp/pushgateway-v{{ pushgateway_version }}-linux-{{ pushgateway_arch }}.tar.gz"
    mode: "0644"
  when: pushgateway_needs_install | bool

- name: Extract pushgateway tarball
  ansible.builtin.unarchive:
    src: "/tmp/pushgateway-v{{ pushgateway_version }}-linux-{{ pushgateway_arch }}.tar.gz"
    dest: "/tmp/pushgateway-v{{ pushgateway_version }}-linux-{{ pushgateway_arch }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
      - --no-same-owner
  when: pushgateway_needs_install | bool

- name: Install pushgateway binaries
  ansible.builtin.copy:
    src: "/tmp/pushgateway-v{{ pushgateway_version }}-linux-{{ pushgateway_arch }}/{{ item }}"
    dest: "{{ pushgateway_install_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  loop: "{{ pushgateway_binaries }}"
  when: pushgateway_needs_install | bool
  notify: Restart pushgateway

- name: Symlink pushgateway binaries to /usr/local/bin
  ansible.builtin.file:
    src: "{{ pushgateway_install_dir }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop: "{{ pushgateway_binaries }}"

- name: Clean up downloaded files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/pushgateway-v{{ pushgateway_version }}-linux-{{ pushgateway_arch }}.tar.gz"
    - "/tmp/pushgateway-v{{ pushgateway_version }}-linux-{{ pushgateway_arch }}"
  when: pushgateway_needs_install | bool

- name: Render pushgateway web security configuration
  ansible.builtin.template:
    src: pushgateway.web.yml.j2
    dest: "{{ pushgateway_web_config_file }}"
    owner: root
    group: "{{ pushgateway_group }}"
    mode: "0640"
  notify: Restart pushgateway
  when: pushgateway_web_config_enabled | bool

- name: Remove pushgateway web security configuration when disabled
  ansible.builtin.file:
    path: "{{ pushgateway_web_config_file }}"
    state: absent
  when: not (pushgateway_web_config_enabled | bool)

- name: Render pushgateway systemd unit
  ansible.builtin.template:
    src: pushgateway.service.j2
    dest: /etc/systemd/system/pushgateway.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Systemd daemon-reload
    - Restart pushgateway

- name: Enable and start pushgateway service
  ansible.builtin.systemd:
    name: pushgateway
    enabled: true
    state: started

