---

- name: Create alertmanager group
  ansible.builtin.group:
    name: "{{ alertmanager_group }}"
    system: true
    state: present

- name: Create alertmanager user
  ansible.builtin.user:
    name: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create alertmanager directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ alertmanager_install_dir }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ alertmanager_data_dir }}", owner: "{{ alertmanager_user }}", group: "{{ alertmanager_group }}", mode: "0700" }
    - { path: "{{ alertmanager_config_dir }}", owner: root, group: "{{ alertmanager_group }}", mode: "0750" }

- name: Check installed alertmanager version
  ansible.builtin.command: "{{ alertmanager_install_dir }}/alertmanager --version"
  register: alertmanager_installed_version
  changed_when: false
  failed_when: false

- name: Set version needs update fact
  ansible.builtin.set_fact:
    alertmanager_needs_install: >-
      {{ alertmanager_installed_version.rc != 0 or
         ('alertmanager, version ' + alertmanager_version) not in alertmanager_installed_version.stdout }}

- name: Download alertmanager tarball
  ansible.builtin.get_url:
    url: "{{ alertmanager_download_url }}"
    dest: "/tmp/alertmanager-v{{ alertmanager_version }}-linux-{{ alertmanager_arch }}.tar.gz"
    mode: "0644"
  when: alertmanager_needs_install | bool

- name: Extract alertmanager tarball
  ansible.builtin.unarchive:
    src: "/tmp/alertmanager-v{{ alertmanager_version }}-linux-{{ alertmanager_arch }}.tar.gz"
    dest: "/tmp/alertmanager-v{{ alertmanager_version }}-linux-{{ alertmanager_arch }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
      - --no-same-owner
  when: alertmanager_needs_install | bool

- name: Install alertmanager binaries
  ansible.builtin.copy:
    src: "/tmp/alertmanager-v{{ alertmanager_version }}-linux-{{ alertmanager_arch }}/{{ item }}"
    dest: "{{ alertmanager_install_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  loop: "{{ alertmanager_binaries }}"
  when: alertmanager_needs_install | bool
  notify: Restart alertmanager

- name: Symlink alertmanager binaries to /usr/local/bin
  ansible.builtin.file:
    src: "{{ alertmanager_install_dir }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop: "{{ alertmanager_binaries }}"

- name: Clean up downloaded files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/alertmanager-v{{ alertmanager_version }}-linux-{{ alertmanager_arch }}.tar.gz"
    - "/tmp/alertmanager-v{{ alertmanager_version }}-linux-{{ alertmanager_arch }}"
  when: alertmanager_needs_install | bool

- name: Render alertmanager configuration
  ansible.builtin.template:
    src: "{{ alertmanager_config_template }}"
    dest: "{{ alertmanager_config_file }}"
    owner: root
    group: "{{ alertmanager_group }}"
    mode: "0640"
  notify: Restart alertmanager

- name: Render alertmanager web security configuration
  ansible.builtin.template:
    src: alertmanager.web.yml.j2
    dest: "{{ alertmanager_web_config_file }}"
    owner: root
    group: "{{ alertmanager_group }}"
    mode: "0640"
  notify: Restart alertmanager
  when: alertmanager_web_config_enabled | bool

- name: Remove alertmanager web security configuration when disabled
  ansible.builtin.file:
    path: "{{ alertmanager_web_config_file }}"
    state: absent
  when: not (alertmanager_web_config_enabled | bool)

- name: Render alertmanager systemd unit
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Systemd daemon-reload
    - Restart alertmanager

- name: Enable and start alertmanager service
  ansible.builtin.systemd:
    name: alertmanager
    enabled: true
    state: started

