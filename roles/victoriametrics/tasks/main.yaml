---
- name: Create victoriametrics group
  ansible.builtin.group:
    name: "{{ victoriametrics_group }}"
    system: true
    state: present

- name: Create victoriametrics user
  ansible.builtin.user:
    name: "{{ victoriametrics_user }}"
    group: "{{ victoriametrics_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create victoriametrics directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ victoriametrics_install_dir }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ victoriametrics_data_dir }}", owner: "{{ victoriametrics_user }}", group: "{{ victoriametrics_group }}", mode: "0700" }
    - { path: "{{ victoriametrics_config_dir }}", owner: root, group: "{{ victoriametrics_group }}", mode: "0750" }

- name: Check installed victoriametrics version
  ansible.builtin.command: "{{ victoriametrics_install_dir }}/{{ victoriametrics_bin }} --version"
  register: victoriametrics_installed_version
  changed_when: false
  failed_when: false

- name: Set version needs update fact
  ansible.builtin.set_fact:
    victoriametrics_needs_install: >-
      {{ victoriametrics_installed_version.rc != 0 or
         (victoriametrics_version not in victoriametrics_installed_version.stdout) }}

- name: Download victoriametrics tarball
  ansible.builtin.get_url:
    url: "{{ victoriametrics_download_url }}"
    dest: "/tmp/victoria-metrics-linux-{{ victoriametrics_arch }}-v{{ victoriametrics_version }}.tar.gz"
    mode: "0644"
  when: victoriametrics_needs_install | bool

- name: Extract victoriametrics tarball
  ansible.builtin.unarchive:
    src: "/tmp/victoria-metrics-linux-{{ victoriametrics_arch }}-v{{ victoriametrics_version }}.tar.gz"
    dest: "/tmp/victoria-metrics-linux-{{ victoriametrics_arch }}-v{{ victoriametrics_version }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
      - --no-same-owner
  when: victoriametrics_needs_install | bool

- name: Install victoriametrics binary
  ansible.builtin.copy:
    src: "/tmp/victoria-metrics-linux-{{ victoriametrics_arch }}-v{{ victoriametrics_version }}/{{ victoriametrics_bin }}"
    dest: "{{ victoriametrics_install_dir }}/{{ victoriametrics_bin }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart victoriametrics
  when: victoriametrics_needs_install | bool

- name: Symlink victoriametrics binary to /usr/local/bin
  ansible.builtin.file:
    src: "{{ victoriametrics_install_dir }}/{{ victoriametrics_bin }}"
    dest: "/usr/local/bin/{{ victoriametrics_bin }}"
    state: link

- name: Clean up downloaded files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/victoria-metrics-linux-{{ victoriametrics_arch }}-v{{ victoriametrics_version }}.tar.gz"
    - "/tmp/victoria-metrics-linux-{{ victoriametrics_arch }}-v{{ victoriametrics_version }}"
  when: victoriametrics_needs_install | bool

# --- vmutils 工具（vmbackup-prod / vmrestore-prod），用于备份与恢复 ---
- name: Check installed vmutils version
  ansible.builtin.command: "{{ victoriametrics_install_dir }}/vmbackup-prod --version"
  register: victoriametrics_vmutils_installed_version
  changed_when: false
  failed_when: false
  when: victoriametrics_install_vmutils | bool

- name: Set vmutils needs update fact
  ansible.builtin.set_fact:
    victoriametrics_vmutils_needs_install: >-
      {{ victoriametrics_vmutils_installed_version is not defined or
         victoriametrics_vmutils_installed_version.rc != 0 or
         (victoriametrics_version not in victoriametrics_vmutils_installed_version.stdout) }}
  when: victoriametrics_install_vmutils | bool

- name: Download vmutils tarball
  ansible.builtin.get_url:
    url: "{{ victoriametrics_vmutils_download_url }}"
    dest: "/tmp/vmutils-linux-{{ victoriametrics_arch }}-v{{ victoriametrics_version }}.tar.gz"
    mode: "0644"
  when:
    - victoriametrics_install_vmutils | bool
    - victoriametrics_vmutils_needs_install | bool

- name: Extract vmutils tarball
  ansible.builtin.unarchive:
    src: "/tmp/vmutils-linux-{{ victoriametrics_arch }}-v{{ victoriametrics_version }}.tar.gz"
    dest: "/tmp/vmutils-linux-{{ victoriametrics_arch }}-v{{ victoriametrics_version }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
      - --no-same-owner
  when:
    - victoriametrics_install_vmutils | bool
    - victoriametrics_vmutils_needs_install | bool

- name: Install vmutils binaries
  ansible.builtin.copy:
    src: "/tmp/vmutils-linux-{{ victoriametrics_arch }}-v{{ victoriametrics_version }}/{{ item }}"
    dest: "{{ victoriametrics_install_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  loop: "{{ victoriametrics_vmutils_binaries }}"
  when:
    - victoriametrics_install_vmutils | bool
    - victoriametrics_vmutils_needs_install | bool

- name: Symlink vmutils binaries to /usr/local/bin
  ansible.builtin.file:
    src: "{{ victoriametrics_install_dir }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop: "{{ victoriametrics_vmutils_binaries }}"
  when: victoriametrics_install_vmutils | bool

- name: Clean up vmutils downloaded files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/vmutils-linux-{{ victoriametrics_arch }}-v{{ victoriametrics_version }}.tar.gz"
    - "/tmp/vmutils-linux-{{ victoriametrics_arch }}-v{{ victoriametrics_version }}"
  when:
    - victoriametrics_install_vmutils | bool
    - victoriametrics_vmutils_needs_install | bool

# --- 系统服务 ---
- name: Render victoriametrics systemd unit
  ansible.builtin.template:
    src: victoriametrics.service.j2
    dest: /etc/systemd/system/victoriametrics.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Systemd daemon-reload
    - Restart victoriametrics

- name: Enable and start victoriametrics service
  ansible.builtin.systemd:
    name: victoriametrics
    enabled: true
    state: started

# --- 备份定时任务（默认关闭）---
- name: Create victoriametrics backup directory
  ansible.builtin.file:
    path: "{{ victoriametrics_backup_dir }}"
    state: directory
    owner: "{{ victoriametrics_user }}"
    group: "{{ victoriametrics_group }}"
    mode: "0700"
  when: victoriametrics_backup_enabled | bool

- name: Render victoriametrics backup script
  ansible.builtin.template:
    src: victoriametrics-backup.sh.j2
    dest: "{{ victoriametrics_backup_script }}"
    owner: root
    group: root
    mode: "0755"
  when: victoriametrics_backup_enabled | bool

- name: Schedule victoriametrics backup cron job
  ansible.builtin.cron:
    name: "victoriametrics backup"
    job: "{{ victoriametrics_backup_script }}"
    user: "{{ victoriametrics_user }}"
    minute: "{{ victoriametrics_backup_minute }}"
    hour: "{{ victoriametrics_backup_hour }}"
    day: "{{ victoriametrics_backup_day }}"
    month: "{{ victoriametrics_backup_month }}"
    weekday: "{{ victoriametrics_backup_weekday }}"
    state: present
  when: victoriametrics_backup_enabled | bool

- name: Remove victoriametrics backup cron job when disabled
  ansible.builtin.cron:
    name: "victoriametrics backup"
    user: "{{ victoriametrics_user }}"
    state: absent
  when: not (victoriametrics_backup_enabled | bool)

