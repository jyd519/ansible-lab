---

etcd_version: "3.5.21"

etcd_install_dir: /usr/share/etcd
etcd_data_dir: /var/etcd
etcd_config_dir: /etc/etcd
etcd_config_file: "{{ etcd_config_dir }}/etcd.conf.yaml"

etcd_user: etcd
etcd_group: etcd

etcd_arch_map:
  x86_64: amd64
  aarch64: arm64
etcd_arch: "{{ etcd_arch_map[ansible_architecture] | default('amd64') }}"

etcd_download_url: >-
  https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-{{ etcd_arch }}.tar.gz

etcd_binaries:
  - etcd
  - etcdctl
  - etcdutl

# Single-node defaults
etcd_name: "{{ inventory_hostname }}"
etcd_listen_client_urls: "http://127.0.0.1:2379"
etcd_advertise_client_urls: "http://127.0.0.1:2379"
etcd_listen_peer_urls: "http://127.0.0.1:2380"
etcd_initial_advertise_peer_urls: "http://127.0.0.1:2380"
etcd_initial_cluster: "{{ etcd_name }}=http://127.0.0.1:2380"
etcd_initial_cluster_state: new
etcd_initial_cluster_token: etcd-cluster

etcd_auto_compaction_retention: "1"
etcd_quota_backend_bytes: 8589934592

