- name: Configure pip mirror for public or ECS internal network
  hosts: all
  vars:
    # 定义两种镜像配置
    pip_mirrors:
      public:
        index_url: "http://mirrors.aliyun.com/pypi/simple/"
        trusted_host: "mirrors.aliyun.com"
      ecs_internal:
        index_url: "http://mirrors.cloud.aliyuncs.com/pypi/simple/"
        trusted_host: "mirrors.cloud.aliyuncs.com"

  tasks:
    - name: Detect if running on Alibaba Cloud ECS (internal network)
      ansible.builtin.uri:
        url: "http://100.100.100.200/latest/meta-data/"
        method: GET
        timeout: 3
        status_code: 200
      register: ecs_metadata_check
      ignore_errors: yes
      changed_when: false

    - name: Set mirror type based on detection result
      ansible.builtin.set_fact:
        mirror_type: "{{ 'ecs_internal' if ecs_metadata_check.status == 200 else 'public' }}"

    - name: Ensure pip configuration directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.pip"
        state: directory
        mode: '0755'

    - name: Configure pip.conf with appropriate mirror
      ansible.builtin.ini_file:
        path: "{{ ansible_env.HOME }}/.pip/pip.conf"
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        mode: '0644'
        backup: yes
      loop:
        - { section: "global", option: "index-url", value: "{{ pip_mirrors[mirror_type].index_url }}" }
        - { section: "install", option: "trusted-host", value: "{{ pip_mirrors[mirror_type].trusted_host }}" }
      loop_control:
        label: "{{ item.section }}: {{ item.option }}"

    - name: Display configured mirror type
      ansible.builtin.debug:
        msg: "Pip mirror configured for {{ mirror_type }}: {{ pip_mirrors[mirror_type].index_url }}"

