---
- name: Install Docker on Ubuntu
  hosts: all
  become: true
  vars:
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      # - docker-buildx-plugin
    docker_repo_url: "https://mirrors.aliyun.com/docker-ce/linux/ubuntu"
    docker_gpg_url: "https://mirrors.aliyun.com/docker-ce/linux/ubuntu/gpg"
    docker_arch: "{{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}"

  tasks:
    # 1. 卸载旧版本（如果存在）
    - name: Remove old Docker versions
      apt:
        name:
          - docker
          - docker-engine
          - docker.io
          - containerd
          - runc
        state: absent

    # 2. 安装前置依赖
    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    # 3. 创建密钥目录
    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # 4. 添加 Docker 官方 GPG 密钥
    - name: Add Docker GPG key
      apt_key:
        url: "docker_gpg_url"
        keyring: /etc/apt/keyrings/docker.gpg
        state: present

    # 5. 添加 Docker APT 仓库
    - name: Add Docker APT repository
      apt_repository:
        repo: >
          deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.gpg]
          {{ docker_repo_url }}
          {{ ansible_distribution_release }}
          stable
        state: present
        filename: docker
        update_cache: true

    # 6. 安装 Docker Engine
    - name: Install Docker packages
      apt:
        name: "{{ docker_packages }}"
        state: present

    # 7. 启动并启用 Docker 服务
    - name: Enable and start Docker service
      systemd:
        name: docker
        enabled: true
        state: started

    # 8. 将当前用户添加到 docker 组（可选）
    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      when: ansible_user is defined

    # 9. 验证安装
    - name: Check Docker version
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      debug:
        msg: "{{ docker_version.stdout }}"

    - name: Test Docker with hello-world
      command: docker run --rm hello-world
      register: docker_test
      changed_when: false

    - name: Display test result
      debug:
        msg: "Docker is working correctly"

